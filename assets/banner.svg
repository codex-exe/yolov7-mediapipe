<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}

.ray{animation:ray 5s linear infinite}
@keyframes ray{0%{stroke-dashoffset:210;opacity:0}8%{opacity:1}30%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.dbox{animation:dbox 5s linear infinite}
@keyframes dbox{0%,29%{stroke:#5b6b86}32%,90%{stroke:#fbbf24}100%{stroke:#5b6b86}}
.dtag{animation:dtag 5s linear infinite}
@keyframes dtag{0%,29%{fill:#5b6b86}32%,90%{fill:#fbbf24}100%{fill:#5b6b86}}
.bulb{animation:bulb 5s linear infinite}
@keyframes bulb{0%,44%{fill:#101a2e;stroke:#8b9bb4}48%,90%{fill:#fde68a;stroke:#fde68a}100%{fill:#101a2e;stroke:#8b9bb4}}
.halo{animation:halo 5s linear infinite}
@keyframes halo{0%,44%{opacity:0}48%,90%{opacity:.22}100%{opacity:0}}
.req{animation:req 5s linear infinite}
@keyframes req{0%,40%{opacity:0}46%,90%{opacity:1}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar 1s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
